<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Graphic design portfolio">
    <title>Graphic Design Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <a class="site-logo" href="#thomas bennett">THOMAS BENNETT</a>

        <nav class="site-nav" aria-label="Main navigation">
            <a href="#work">WORK</a>
            <a href="#about">ABOUT</a>
        </nav>
    </header>

    <main id="work">
        <section class="gallery" id="gallery" aria-label="Selected graphic design work">
            <!-- Gallery generated by JavaScript -->
        </section>
    </main>

    <section class="about" id="about">
        <div class="about-inner">
            <p class="eyebrow">ABOUT</p>
            <h1>Graphic designer working across print, digital, branding and visual communication.</h1>
            <p class="about-copy">
                
            </p>
        </div>
    </section>

    <div class="viewer" id="viewer" aria-hidden="true">
        <button class="viewer-close" id="viewerClose" aria-label="Close viewer">×</button>
        <button class="viewer-prev" id="viewerPrev" aria-label="Previous project">←</button>

        <div class="viewer-content">
            <img id="viewerImage" src="" alt="">
            <div class="viewer-info">
                <div>
                    <span id="viewerTitle"></span>
                    <span class="viewer-separator">—</span>
                    <span id="viewerCategory"></span>
                    <span class="viewer-separator">—</span>
                    <span id="viewerYear"></span>
                </div>
                <span id="viewerCounter"></span>
            </div>
        </div>

        <button class="viewer-next" id="viewerNext" aria-label="Next project">→</button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
